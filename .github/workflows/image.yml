name: Image

# Builds ./Containerfile, tests it, and publishes ghcr.io/<owner>/wrapvm, which
# the Smolfile boots. Rebuilt weekly and on demand so a new wrap base image
# (ghcr.io/tobi/wrap:latest) reaches the VM without a commit here; tobi/wrap can
# also send a repository_dispatch of type `base-image` after it publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [base-image]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BuildKit: the Containerfile writes its scripts with RUN heredocs, which
      # Docker's legacy builder turns into empty files.
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          pull: true
          tags: localhost/wrapvm:test
          cache-from: type=gha,scope=wrapvm
          cache-to: type=gha,mode=max,scope=wrapvm

      - name: Test the desktop's accessibility path (agent-desktop, agent-browser)
        run: docker run --rm -v "$PWD/tests:/tests:ro" localhost/wrapvm:test bash -l /tests/container_desktop_a11y.sh

      - name: Test a plain detached run (CDP, SIGTERM)
        run: CONTAINER_ENGINE=docker bash tests/container_desktop_run.sh localhost/wrapvm:test

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The same build again, from the cache the first one filled.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wrapvm
